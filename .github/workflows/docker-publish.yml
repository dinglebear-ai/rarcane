name: Docker Publish

on:
  release:
    types: [published]

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/dinglebear-ai/rarcane

jobs:
  container:
    name: Build, scan, attest, and publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      image: ghcr.io/dinglebear-ai/rarcane
      release-tag: ${{ github.event.release.tag_name }}
      dockerfile: config/Dockerfile
      smoke-command: docker run --rm "$IMAGE_REF" --version
      cache-scope: rarcane-release
      timeout-minutes: 60
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-tags:
    name: Promote release aliases
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified digest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          }
          minor="${version%.*}"
          source="${IMAGE_NAME}:${RELEASE_TAG}"
          digest="$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')"
          for tag in "$version" "$minor" latest; do
            docker buildx imagetools create --tag "${IMAGE_NAME}:${tag}" "${IMAGE_NAME}@${digest}"
          done
